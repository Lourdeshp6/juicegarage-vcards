
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">

  <title>Marc Raventós Cobo | JUICE GARAGE SL</title>
  <meta name="description" content="Tarjeta profesional de Marc Raventós Cobo, JUICE GARAGE SL">

  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f2f2f2;
      color: #111;
      font: 16px system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 460px);
      border: 1px solid #d6d6d6;
      border-radius: 22px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 18px 60px #0002;
    }

    .top {
      padding: 30px 25px 18px;
      border-top: 7px solid #111;
      text-align: center;
    }

    .logo {
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 9px;
    }

    .logo img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 130px;
      object-fit: contain;
    }

    .small {
      color: #555;
      letter-spacing: .11em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 750;
    }

    .name {
      font-size: clamp(26px, 6vw, 34px);
      line-height: 1.13;
      margin: 12px 0;
      color: #090909;
    }

    .role {
      line-height: 1.5;
      color: #555;
      margin: 0 0 22px;
    }

    .actions {
      display: grid;
      gap: 10px;
      padding: 0 25px 25px;
    }

    .action {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #f7f7f7;
      font-weight: 650;
    }

    .action:hover,
    .action:focus-visible {
      border-color: #111;
      background: #ececec;
    }

    .symbol {
      color: #111;
      font-size: 21px;
      width: 25px;
      text-align: center;
    }

    .primary {
      background: #111;
      color: #fff;
      border-color: #111;
      justify-content: center;
      font-weight: 800;
    }

    .primary:hover,
    .primary:focus-visible {
      background: #333;
      color: #fff;
    }

    .primary .symbol { color: #fff; }

    .foot {
      text-align: center;
      border-top: 1px solid #ddd;
      padding: 22px;
    }

    .foot img {
      width: min(200px, 80%);
      background: white;
      padding: 8px;
      border-radius: 12px;
    }

    .hint {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .shell { padding: 10px; }
      .top { padding: 24px 18px; }
      .actions { padding: 0 18px 20px; }
    }
  </style>
</head>

<body>
  <main class="shell">
    <article class="card">

      <header class="top">
        <div class="logo">
          <img src="./logo-oficial.png"
               alt="JUICE GARAGE - Food Innovation Company">
        </div>

        <div class="small">
          JUICE GARAGE SL · CONTACTO PROFESIONAL
        </div>

        <h1 class="name">MARC RAVENTÓS COBO</h1>

        <p class="role">
          Fundador | Innovación y Desarrollo de Producto
        </p>
      </header>

      <nav class="actions" aria-label="Opciones de contacto">

        <a class="action" href="tel:+34637408287">
          <span class="symbol">☎</span>
          Llamar · +34 637 40 82 87
        </a>

        <a class="action"
           href="https://wa.me/34637408287"
           target="_blank"
           rel="noopener noreferrer">
          <span class="symbol">✆</span>
          Enviar WhatsApp
        </a>

        <a class="action" href="mailto:marc.r@juicegarage.es">
          <span class="symbol">✉</span>
          Enviar correo electrónico
        </a>

        <a class="action"
           href="https://www.sucs.es"
           target="_blank"
           rel="noopener noreferrer">
          <span class="symbol">↗</span>
          Visitar www.sucs.es
        </a>

        <a class="action primary"
           href="./marc-raventos-cobo.vcf"
           download="marc-raventos-cobo.vcf">
          <span class="symbol">↓</span>
          GUARDAR CONTACTO
        </a>

      </nav>

      <footer class="foot">
        <img src="./qr-marc-contacto.png"
             alt="Código QR con los datos de contacto de Marc">

        <p class="hint">
          Escanea este QR para guardar los datos de contacto.
        </p>
      </footer>

    </article>
  </main>
</body>
</html>
