<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipo | JUICE GARAGE SL</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="card"><div class="top"><div class="logo"><img src="logo-oficial.png" alt="JUICE GARAGE — Food Innovation Company"></div><h1>Directorio de equipo</h1><p class="role">Contactos disponibles</p></div><div class="actions" id="staff"></div></section></main><script>fetch('empleados.json').then(r=>r.json()).then(a=>{const box=document.getElementById('staff');a.forEach(x=>{let link=document.createElement('a');link.className='action';link.href=x.id==='marc-raventos-cobo'?'index.html':x.id+'/index.html';link.textContent=x.name+' · '+x.role;box.append(link)})}).catch(()=>document.getElementById('staff').textContent='Para visualizar el directorio, publica los archivos en un servidor web.');</script></body></html>
